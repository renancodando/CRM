name: Sessão de prospecção
on:
  pull_request:
  push:
    branches: [main, fix/sessao-prospeccao]
permissions:
  contents: read
jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix /tmp/orbita-playwright playwright
      - run: /tmp/orbita-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Testar sessão no navegador
        run: |
          python3 -m http.server 3111 > /tmp/orbita-http.log 2>&1 &
          export NODE_PATH=/tmp/orbita-playwright/node_modules
          node testes/sessao-prospeccao.cjs
